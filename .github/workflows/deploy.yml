name: Deploy Hugo Site

on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # 每天 UTC 22:00(北京时间 06:00)重建一次,刷新页脚累计浏览量;
    # 数字本身只写进当次构建产物,不回 commit,不会产生部署循环
    - cron: '0 22 * * *'

permissions:
  contents: read
  actions: write

concurrency:
  group: "cloudflare-workers"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.167.0'
          extended: true

      - name: Cache IBM Plex source
        uses: actions/cache@v6
        with:
          path: .cache/ibm-plex
          key: ibm-plex-1.1.0

      - name: Install font tooling
        run: python3 -m pip install --quiet fonttools brotli

      - name: Regenerate font subsets
        run: |
          scripts/build-fonts.sh

      # 可选:若仓库 secret 里配置了 CF_ANALYTICS_TOKEN,则每次构建时把
      # 页脚累计浏览量刷新到最新(仅写进本次构建,不回commit,避免部署循环);
      # 未配置时脚本优雅跳过,使用仓库里上次提交的 data/analytics.json。
      - name: Refresh page-view data
        continue-on-error: true
        env:
          CF_API_TOKEN: ${{ secrets.CF_ANALYTICS_TOKEN }}
        run: python3 scripts/fetch-analytics.py

      - name: Build
        run: hugo --minify

      - name: Deploy to Cloudflare Workers
        id: deployment
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          wranglerVersion: "latest"
          command: deploy

      - name: Show Workers URL
        run: echo "Deployed to ${{ steps.deployment.outputs.deployment-url }}"

      # 影子部署阶段不应通知搜索引擎;切域验证通过后再把仓库变量
      # CF_CUSTOM_DOMAIN_READY 设为 true。
      - name: Ping IndexNow
        if: github.ref == 'refs/heads/main' && vars.CF_CUSTOM_DOMAIN_READY == 'true'
        run: python scripts/indexnow.py public/sitemap.xml

      # 清扫历史运行,只留当前——Actions 页面单条滚动
      - name: Prune old workflow runs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          KEEP=${{ github.run_id }}
          gh api "repos/${{ github.repository }}/actions/runs?per_page=100" --paginate --jq '.workflow_runs[] | select(.id != '"$KEEP"') | select(.status == "completed") | .id' | while read -r id; do gh api -X DELETE "repos/${{ github.repository }}/actions/runs/$id" > /dev/null 2>&1 || true; done
