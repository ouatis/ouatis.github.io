<!doctype html>
<html lang="zh-cn">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="https://ouatis.com/fonts/split/result.css">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body {
    position: relative;
    background: #151917;
    color: #eef1ed;
    font-family: "Noto Serif SC Subset", "Songti SC", SimSun, serif;
  }
  .rule-top, .rule-bottom {
    position: absolute; left: 64px; right: 64px; height: 1px; background: #343d38;
  }
  .rule-top { top: 56px; }
  .rule-bottom { bottom: 56px; }
  .kicker {
    position: absolute; top: 84px; left: 64px;
    color: #648f77;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    font-size: 19px; letter-spacing: 3px; font-weight: 600;
  }
  .title {
    position: absolute; left: 64px; top: 236px;
    font-size: 128px; font-weight: 700; line-height: 1.08; letter-spacing: 4px;
  }
  .intro {
    position: absolute; left: 64px; top: 436px;
    color: #a4ada7; font-size: 24px; letter-spacing: 1px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .caption {
    position: absolute; left: 64px; bottom: 84px;
    color: #a4ada7; font-size: 17px; letter-spacing: 4px;
    font-family: -apple-system, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
  }
  .seal {
    position: absolute; right: 96px; top: 50%; transform: translateY(-50%);
    width: 300px; height: 300px; border-radius: 50%;
    border: 1px solid #3a433e; padding: 14px;
  }
  .seal::after {
    content: ""; position: absolute; inset: -16px;
    border: 1px solid #3a433e; border-radius: 50%; opacity: 0.55;
  }
  .seal img {
    width: 100%; height: 100%; object-fit: cover; border-radius: 50%; display: block;
  }
</style>
</head>
<body>
  <div class="rule-top"></div>
  <div class="rule-bottom"></div>
  <div class="kicker">ONCE UPON A TIME IN SIGIL</div>
  <div class="title">笼城往事</div>
  <div class="intro">写作、福楼拜，以及其他。</div>
  <div class="caption">IMAGINE UNPOETIC LION</div>
  <div class="seal"><img src="https://ouatis.com/avatar.webp" alt=""></div>
</body>
</html>
